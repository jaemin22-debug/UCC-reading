<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Practice of UCC Script</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 650px; }
        h1 { color: #1a73e8; text-align: center; margin-bottom: 10px; }
        .instruction { background: #e8f0fe; padding: 15px; border-radius: 8px; font-size: 0.9rem; color: #1967d2; line-height: 1.5; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #3c4043; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #dfe1e5; border-radius: 5px; box-sizing: border-box; }
        textarea { width: 100%; height: 250px; padding: 15px; border: 2px solid #dfe1e5; border-radius: 10px; font-size: 16px; box-sizing: border-box; transition: border 0.3s; line-height: 1.6; }
        textarea:focus { border-color: #1a73e8; outline: none; }
        .info-bar { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.85rem; color: #5f6368; }
        .controls { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 25px; border-top: 1px solid #eee; pt: 20px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        button { padding: 12px 20px; border: none; border-radius: 25px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; }
        #startBtn { background-color: #d93025; color: white; }
        #stopBtn { background-color: #3c4043; color: white; display: none; }
        .btn-download-audio { background-color: #188038; color: white; display: none; }
        #pdfBtn { background-color: #1a73e8; color: white; }
        button:active { transform: scale(0.95); }
        audio { width: 100%; margin-top: 15px; border-radius: 10px; display: none; }
        .status { font-weight: bold; color: #d93025; display: none; margin-bottom: 5px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Reading Practice of UCC Script</h1>
    <div class="instruction">
        <strong>Guide:</strong> "Based on the revised script, record your voice. Ensure at least 2 minutes of audio. You MUST download both the <b>PDF (Script)</b> and <b>Audio file</b> to submit."
    </div>
    
    <div class="input-group">
        <label>Student Name / Team Name</label>
        <input type="text" id="studentInfo" placeholder="e.g. 20261234 Jaemin Han / Team Men">
    </div>

    <label>Script Content</label>
    <textarea id="scriptInput" placeholder="Paste your script here..."></textarea>
    <div class="info-bar">
        <span id="wordCount">Words: 0</span>
        <span id="charCount">Characters: 0</span>
    </div>

    <div class="controls">
        <div class="btn-group">
            <button id="pdfBtn">Step 1: Download Script (PDF)</button>
        </div>
        <div id="recordingStatus" class="status">● RECORDING...</div>
        <div class="btn-group">
            <button id="startBtn">Step 2: Start Recording</button>
            <button id="stopBtn">Stop</button>
            <button id="downloadAudioBtn" class="btn-download-audio">Step 3: Download Audio</button>
        </div>
        <audio id="audioPlayback" controls></audio>
    </div>
</div>

<script>
    const { jsPDF } = window.jspdf;
    let mediaRecorder;
    let audioChunks = [];
    let audioUrl = null;

    const scriptInput = document.getElementById('scriptInput');
    const studentInfo = document.getElementById('studentInfo');
    const wordCount = document.getElementById('wordCount');
    const charCount = document.getElementById('charCount');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadAudioBtn = document.getElementById('downloadAudioBtn');
    const pdfBtn = document.getElementById('pdfBtn');
    const audioPlayback = document.getElementById('audioPlayback');
    const statusIdx = document.getElementById('recordingStatus');

    // 카운트 체크
    scriptInput.addEventListener('input', () => {
        const text = scriptInput.value.trim();
        charCount.innerText = `Characters: ${text.length}`;
        wordCount.innerText = `Words: ${text ? text.split(/\s+/).length : 0}`;
    });

    // PDF 다운로드 기능
    pdfBtn.onclick = () => {
        const info = studentInfo.value.trim();
        const content = scriptInput.value.trim();

        if (!info || !content) {
            alert("Please enter both your name and the script content.");
            return;
        }

        const doc = new jsPDF();
        doc.setFontSize(18);
        doc.text("Global English: UCC Project Script", 20, 20);
        
        doc.setFontSize(12);
        doc.text(`Student/Team: ${info}`, 20, 35);
        doc.text(`Date: ${new Date().toLocaleDateString()}`, 20, 42);
        
        doc.line(20, 47, 190, 47); // 구분선

        // 긴 텍스트 줄바꿈 처리
        const splitContent = doc.splitTextToSize(content, 170);
        doc.text(splitContent, 20, 55);

        doc.save(`UCC_Script_${info.replace(/\s/g, '_')}.pdf`);
    };

    // 오디오 녹음 기능
    startBtn.onclick = async () => {
        audioChunks = [];
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
            mediaRecorder = new MediaRecorder(stream, { mimeType });

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                if (audioUrl) URL.revokeObjectURL(audioUrl);
                audioUrl = URL.createObjectURL(audioBlob);
                audioPlayback.src = audioUrl;
                audioPlayback.style.display = 'block';
                downloadAudioBtn.style.display = 'inline-block';
                stream.getTracks().forEach(track => track.stop());
            };

            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.style.display = 'inline-block';
            statusIdx.style.display = 'block';
            downloadAudioBtn.style.display = 'none';
        } catch (err) {
            alert("Microphone access denied: " + err);
        }
    };

    stopBtn.onclick = () => {
        mediaRecorder.stop();
        startBtn.disabled = false;
        startBtn.innerText = "Record Again";
        stopBtn.style.display = 'none';
        statusIdx.style.display = 'none';
    };

    downloadAudioBtn.onclick = () => {
        const info = studentInfo.value.trim() || "Student";
        const a = document.createElement('a');
        a.href = audioUrl;
        const extension = mediaRecorder.mimeType.includes('webm') ? 'webm' : 'ogg';
        a.download = `UCC_Audio_${info.replace(/\s/g, '_')}.${extension}`;
        a.click();
    };
</script>

</body>
</html>
